<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PVHS Dashboard">
<meta name="theme-color" content="#007474">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<title>PVHS Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #021414;
    --surface: rgba(255,255,255,0.02);
    --surface2: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.05);
    --border-hover: rgba(255,255,255,0.14);
    --teal: #007474;
    --teal-light: #40dede;
    --teal-dim: rgba(0,180,180,0.07);
    --text: #cfe3e3;
    --text-muted: rgba(207,227,227,0.5);
    --text-bright: #f7fbfb;
    --danger: #ff5b5b;
    --warning: #ffac39;
    --success: #50c864;
    --panel-radius: 22px;
    --btn-radius: 16px;
    --shadow: 0 12px 24px rgba(0,0,0,0.22);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* -- Login Screen -- */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 2rem;
  }
  .login-card {
    background: var(--surface); border: 1px solid var(--border-hover);
    border-radius: var(--panel-radius); padding: 3rem;
    max-width: 440px; width: 100%; text-align: center;
    backdrop-filter: blur(10px); box-shadow: var(--shadow);
  }
  .login-card img { width: 120px; margin-bottom: 1.5rem; }
  .login-card h1 { font-size: 1.5rem; color: var(--text-bright); margin-bottom: 0.5rem; }
  .login-card p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; line-height: 1.5; }
  .login-error { color: var(--danger); font-size: 0.85rem; margin-bottom: 1rem; display: none; }

  .google-btn {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 12px 28px; border-radius: 8px; border: 1px solid var(--border-hover);
    background: rgba(255,255,255,0.05); color: var(--text-bright);
    font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: all 0.2s;
  }
  .google-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--teal); }
  .google-btn:active { transform: scale(0.97); }
  .google-btn svg { flex-shrink: 0; }

  /* -- Dashboard -- */
  #dashboard { display: none; }

  .top-bar {
    background: rgba(2,20,20,0.85); border-bottom: 1px solid var(--border);
    padding: 0.75rem 2rem; display: flex; align-items: center; gap: 1.25rem;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(16px);
  }
  .top-bar img { height: 44px; }
  .top-bar-title {
    font-size: 13px; font-weight: 700; color: var(--text-bright);
    text-transform: uppercase; letter-spacing: 0.14em;
  }
  .top-bar-spacer { flex: 1; }
  .user-info {
    display: flex; align-items: center; gap: 0.6rem;
    font-size: 0.8rem; color: var(--text-muted);
  }
  .user-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid var(--teal);
  }
  .status-area { display: flex; align-items: center; gap: 0.75rem; }
  .last-updated { font-size: 0.72rem; color: var(--text-muted); text-align: right; line-height: 1.3; }

  .btn {
    display: inline-block; padding: 0.5rem 1.2rem; border-radius: 8px;
    border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    transition: all 0.2s;
  }
  .btn-small { padding: 0.35rem 0.85rem; font-size: 0.78rem; }
  .btn-outline {
    background: transparent; border: 1px solid var(--border); color: var(--text-muted);
  }
  .btn-outline:hover { border-color: var(--teal); color: var(--teal-light); }
  .btn-primary {
    background: rgba(0,180,180,0.14); border: 1px solid rgba(0,210,210,0.16);
    color: var(--teal-light);
  }
  .btn-primary:hover { background: rgba(0,180,180,0.22); }
  .btn-primary:active { transform: scale(0.97); }
  .btn-danger {
    background: rgba(255,77,77,0.1); border: 1px solid rgba(255,77,77,0.25);
    color: var(--danger);
  }
  .btn-danger:hover { background: rgba(255,77,77,0.2); }

  .refresh-btn {
    background: none; border: 1px solid var(--border); color: var(--teal-light);
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .refresh-btn:hover { border-color: var(--teal); background: var(--teal-dim); }
  .refresh-btn.spinning svg { animation: spin-ccw 1s linear infinite; }
  @keyframes spin-ccw { from { transform: rotate(0); } to { transform: rotate(-360deg); } }

  /* -- Tabs -- */
  .tab-bar {
    display: flex; gap: 0; background: rgba(2,20,20,0.6);
    border-bottom: 1px solid var(--border); padding: 0 2rem;
    backdrop-filter: blur(10px);
  }
  .tab-btn {
    padding: 0.8rem 1.5rem; border: none; background: none;
    color: var(--text-muted); font-size: 10px; font-weight: 700;
    cursor: pointer; border-bottom: 2px solid transparent;
    transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.12em;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--teal-light); border-bottom-color: var(--teal); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* -- Main Area -- */
  .main-content { padding: 1.5rem 2rem 3rem; }

  /* -- Summary Cards -- */
  .summary-row { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .summary-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--panel-radius); padding: 1.25rem 1.5rem;
    flex: 1; min-width: 180px; backdrop-filter: blur(10px); box-shadow: var(--shadow);
  }
  .summary-card .label {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--text-muted); margin-bottom: 0.35rem; font-weight: 700;
  }
  .summary-card .value { font-size: 2rem; font-weight: 700; color: var(--teal-light); }
  .summary-card .sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }

  /* -- Course Sections -- */
  .course-section { margin-bottom: 2rem; }
  .course-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .course-header h2 { font-size: 1.15rem; color: var(--text-bright); font-weight: 700; }
  .course-badge {
    background: var(--teal-dim); color: var(--teal-light);
    font-size: 0.7rem; font-weight: 600; padding: 0.2rem 0.6rem;
    border-radius: 20px; text-transform: uppercase;
  }

  /* -- Period Groups -- */
  .period-group { margin-bottom: 1rem; }
  .period-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--teal-light); margin-bottom: 0.5rem;
    padding-left: 0.25rem;
  }

  /* -- Student Rows -- */
  .student-list {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--panel-radius); overflow: hidden;
    backdrop-filter: blur(10px); box-shadow: var(--shadow);
  }
  .student-row { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
  .student-row:last-child { border-bottom: none; }
  .student-row:hover { background: var(--surface2); }
  .student-row-header {
    display: flex; align-items: center; padding: 0.65rem 1rem; gap: 0.6rem;
  }
  .student-name { font-weight: 600; font-size: 0.92rem; color: var(--text-bright); flex: 1; min-width: 0; }
  .student-num { font-size: 0.75rem; color: var(--text-muted); min-width: 1.5rem; text-align: right; }
  .missing-count {
    font-size: 0.78rem; font-weight: 700; padding: 0.18rem 0.6rem;
    border-radius: 20px; min-width: 7rem; text-align: center;
  }
  .missing-count.high { background: rgba(255,77,77,0.15); color: var(--danger); }
  .missing-count.medium { background: rgba(240,160,48,0.15); color: var(--warning); }
  .missing-count.low { background: rgba(0,116,116,0.15); color: var(--teal-light); }
  .missing-pts {
    font-size: 0.78rem; font-weight: 700; background: rgba(64,222,222,0.1);
    color: var(--teal-light); padding: 0.15rem 0.5rem; border-radius: 999px;
    white-space: nowrap; min-width: 5rem; text-align: center;
  }
  .expand-icon { color: var(--text-muted); font-size: 0.7rem; transition: transform 0.2s; }
  .student-row.expanded .expand-icon { transform: rotate(90deg); }
  .student-detail { display: none; padding: 0 1rem 0.65rem; }
  .student-row.expanded .student-detail { display: block; }
  .assignment-list { list-style: none; }
  .assignment-list li {
    padding: 0.35rem 0.65rem; font-size: 0.83rem; color: var(--text-muted);
    border-left: 2px solid var(--border); margin-bottom: 0.2rem;
    display: flex; justify-content: space-between; gap: 1rem;
  }
  .assignment-list li .asgn-name { flex: 1; }
  .assignment-list li .asgn-due { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }
  .assignment-list li .asgn-pts { font-size: 0.72rem; color: var(--teal-light); white-space: nowrap; opacity: 0.8; }

  /* -- On-Track Section -- */
  .on-track-section { margin-top: 0.4rem; border: 1px solid rgba(80,200,100,0.2); border-radius: 8px; overflow: hidden; }
  .on-track-header {
    display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.75rem;
    cursor: pointer; user-select: none; font-size: 0.8rem; color: var(--success);
    background: rgba(50,205,100,0.06);
  }
  .on-track-header:hover { background: rgba(50,205,100,0.12); }
  .on-track-chevron { transition: transform 0.2s; font-size: 0.55rem; }
  .on-track-section.open .on-track-chevron { transform: rotate(90deg); }
  .on-track-list { display: none; }
  .on-track-section.open .on-track-list { display: block; }
  .on-track-row {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.35rem 0.75rem; font-size: 0.85rem; border-top: 1px solid var(--border);
  }

  /* -- Sort Bar -- */
  .sort-bar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .sort-label { font-size: 0.78rem; color: var(--text-muted); margin-right: 0.25rem; }
  .sort-btn {
    padding: 0.3rem 0.8rem; border-radius: 20px; border: 1px solid var(--border);
    background: none; color: var(--text-muted); font-size: 0.78rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .sort-btn:hover { border-color: var(--teal); color: var(--text); }
  .sort-btn.active { background: var(--teal-dim); border-color: var(--teal); color: var(--teal-light); }

  /* -- Search Tab -- */
  .search-box { display: flex; gap: 0.75rem; max-width: 600px; margin-bottom: 1rem; }
  .search-box input {
    flex: 1; padding: 10px 14px; border-radius: var(--btn-radius);
    border: 1px solid var(--border-hover); background: rgba(0,0,0,0.18);
    color: var(--text-bright); font-size: 0.95rem; outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--teal-light); }
  .search-box input::placeholder { color: var(--text-muted); }

  /* -- Grading Tab -- */
  .grading-controls { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .grading-label { font-size: 0.82rem; color: var(--text-muted); white-space: nowrap; }
  .select-input {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 0.85rem;
    padding: 0.4rem 0.75rem; cursor: pointer; min-width: 200px;
  }
  .select-input:focus { outline: none; border-color: var(--teal); }

  .grade-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 0.6rem; padding: 0.75rem 1rem;
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
  }
  .grade-card-name { font-size: 0.9rem; font-weight: 600; color: var(--text-bright); flex: 1; min-width: 160px; }
  .grade-card-status {
    font-size: 0.72rem; padding: 0.1rem 0.45rem; border-radius: 999px;
    white-space: nowrap; font-weight: 600;
  }
  .grade-card-status.submitted { background: rgba(64,222,222,0.1); color: var(--teal-light); }
  .grade-card-status.missing { background: rgba(255,100,100,0.1); color: #ff7070; }
  .grade-card-status.graded { background: rgba(80,200,100,0.1); color: var(--success); }
  .grade-input {
    width: 60px; padding: 0.3rem 0.5rem; border-radius: 6px;
    border: 1px solid var(--border); background: rgba(0,0,0,0.2);
    color: var(--text-bright); font-size: 0.85rem; text-align: center;
  }
  .grade-input:focus { outline: none; border-color: var(--teal-light); }
  .grade-max { font-size: 0.78rem; color: var(--text-muted); }
  .grade-comment {
    width: 100%; margin-top: 0.4rem; padding: 0.4rem 0.6rem; border-radius: 6px;
    border: 1px solid var(--border); background: rgba(0,0,0,0.15);
    color: var(--text); font-size: 0.82rem; resize: vertical; min-height: 36px;
    font-family: inherit;
  }
  .grade-comment:focus { outline: none; border-color: var(--teal-light); }

  /* -- Bulk Comment Panel -- */
  .bulk-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--panel-radius); padding: 1.25rem; margin-bottom: 1.5rem;
  }
  .bulk-panel h3 { font-size: 0.9rem; color: var(--text-bright); margin-bottom: 0.75rem; }
  .bulk-panel textarea {
    width: 100%; padding: 0.6rem 0.8rem; border-radius: 8px;
    border: 1px solid var(--border); background: rgba(0,0,0,0.15);
    color: var(--text); font-size: 0.85rem; resize: vertical; min-height: 60px;
    font-family: inherit; margin-bottom: 0.75rem;
  }
  .bulk-panel textarea:focus { outline: none; border-color: var(--teal-light); }
  .bulk-count { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.5rem; }

  /* -- Loading / Error -- */
  .loading-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 200;
    align-items: center; justify-content: center; flex-direction: column; gap: 1rem;
  }
  .loading-overlay.visible { display: flex; }
  .spinner {
    width: 48px; height: 48px; border: 4px solid var(--border);
    border-top-color: var(--teal); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .loading-text { color: var(--text-muted); font-size: 0.9rem; }
  .error-banner {
    background: rgba(255,77,77,0.1); border: 1px solid rgba(255,77,77,0.3);
    border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.5rem;
    color: var(--danger); font-size: 0.9rem; display: none;
  }
  .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 1rem; }

  /* -- Responsive -- */
  @media (max-width: 768px) {
    .top-bar { padding: 0.6rem 1rem; gap: 0.75rem; }
    .top-bar-title { font-size: 11px; }
    .main-content { padding: 1rem; }
    .tab-btn { padding: 0.6rem 1rem; font-size: 9px; }
    .summary-card .value { font-size: 1.5rem; }
    .user-info span { display: none; }
  }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-card">
    <img src="PV_Logo.png" alt="PVHS">
    <h1>PVHS Dashboard</h1>
    <p>Sign in with your Google account to access the teacher command center.</p>
    <div id="login-error" class="login-error"></div>
    <button class="google-btn" onclick="googleSignIn()">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </button>
  </div>
</div>

<!-- Loading Overlay -->
<div id="loading-overlay" class="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">Loading...</div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="top-bar">
    <img src="PV_Logo.png" alt="PVHS">
    <div class="top-bar-title">PVHS Dashboard</div>
    <div class="top-bar-spacer"></div>
    <div class="status-area">
      <div class="last-updated" id="last-updated"></div>
      <button class="refresh-btn" id="refresh-btn" onclick="manualRefresh()" title="Refresh data from Canvas">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M1 1v5h5"/><path d="M2.5 10A5.5 5.5 0 1 0 3 5.5L1 6"/>
        </svg>
      </button>
    </div>
    <div class="user-info" id="user-info">
      <span id="user-name"></span>
      <img class="user-avatar" id="user-avatar" src="" alt="" style="display:none">
    </div>
    <button class="btn btn-small btn-outline" onclick="signOut()">Sign Out</button>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">Overview</button>
    <button class="tab-btn" data-tab="grading" onclick="switchTab('grading')">Grading</button>
    <button class="tab-btn" data-tab="search" onclick="switchTab('search')">Search</button>
    <button class="tab-btn" data-tab="bulk" onclick="switchTab('bulk')">Bulk Comment</button>
  </div>

  <div class="main-content">
    <div id="error-banner" class="error-banner"></div>

    <!-- Overview Tab -->
    <div id="tab-overview" class="tab-content active">
      <div class="summary-row" id="summary-row"></div>
      <div class="sort-bar">
        <span class="sort-label">Sort:</span>
        <button class="sort-btn active" data-sort="last" onclick="changeSort('last')">Last Name</button>
        <button class="sort-btn" data-sort="first" onclick="changeSort('first')">First Name</button>
        <button class="sort-btn" data-sort="most" onclick="changeSort('most')">Most Missing</button>
        <button class="sort-btn" data-sort="pts" onclick="changeSort('pts')">Most Points</button>
      </div>
      <div id="courses-container"></div>
    </div>

    <!-- Grading Tab -->
    <div id="tab-grading" class="tab-content">
      <div class="grading-controls">
        <label class="grading-label">Course</label>
        <select id="grade-course-select" class="select-input" onchange="loadAssignmentsForGrading()">
          <option value="">Select course</option>
        </select>
        <label class="grading-label">Assignment</label>
        <select id="grade-assignment-select" class="select-input" onchange="loadGradingQueue()">
          <option value="">Select assignment</option>
        </select>
      </div>
      <div id="grading-queue">
        <div class="empty-state">Select a course and assignment to load the grading queue.</div>
      </div>
      <div id="grading-actions" style="display:none; margin-top:1rem;">
        <button class="btn btn-primary" onclick="submitAllGrades()">Apply All Grades to Canvas</button>
      </div>
    </div>

    <!-- Search Tab -->
    <div id="tab-search" class="tab-content">
      <div class="search-box">
        <input type="text" id="assignment-search" placeholder="Type an assignment name to find who hasn't submitted..." oninput="handleAssignmentSearch()">
      </div>
      <div id="search-results">
        <div class="empty-state">Start typing an assignment name to search across all courses.</div>
      </div>
    </div>

    <!-- Bulk Comment Tab -->
    <div id="tab-bulk" class="tab-content">
      <div class="bulk-panel">
        <h3>Bulk Comment on Missing Assignments</h3>
        <div class="grading-controls" style="margin-bottom:1rem;">
          <label class="grading-label">Course</label>
          <select id="bulk-course-select" class="select-input" onchange="loadAssignmentsForBulk()">
            <option value="">Select course</option>
          </select>
          <label class="grading-label">Assignment</label>
          <select id="bulk-assignment-select" class="select-input" onchange="loadBulkTargets()">
            <option value="">Select assignment</option>
          </select>
        </div>
        <div class="bulk-count" id="bulk-count"></div>
        <textarea id="bulk-comment" placeholder="Write a comment that will be sent to all students who haven't turned in this assignment..."></textarea>
        <button class="btn btn-primary" id="bulk-send-btn" onclick="sendBulkComments()" disabled>Send Comment to All Missing Students</button>
      </div>
      <div id="bulk-results"></div>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>

firebase.initializeApp({

  authDomain:        'girl-scouts-silva.firebaseapp.com',

});

const auth = firebase.auth();

// ───────────────────────────────────────────────────────
// State
// ───────────────────────────────────────────────────────
let currentUser   = null;
let idToken       = null;
let dashboardData = [];
let currentSort   = 'last';
let coursesCache  = [];
let bulkTargets   = [];

// ───────────────────────────────────────────────────────
// Auth
// ───────────────────────────────────────────────────────
auth.onAuthStateChanged(async user => {
  if (user) {
    currentUser = user;
    idToken = await user.getIdToken();
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('user-name').textContent = user.displayName || user.email;
    if (user.photoURL) {
      const av = document.getElementById('user-avatar');
      av.src = user.photoURL;
      av.style.display = 'block';
    }
    loadDashboard();
  } else {
    currentUser = null;
    idToken = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
  }
});

function googleSignIn() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => {
    const el = document.getElementById('login-error');
    el.textContent = err.message;
    el.style.display = 'block';
  });
}

function signOut() { auth.signOut(); }

// ───────────────────────────────────────────────────────
// API Helper (injects Firebase token, retries on 401)
// ───────────────────────────────────────────────────────
async function api(path, opts = {}) {
  if (!idToken) idToken = await currentUser.getIdToken(true);
  const headers = { 'Authorization': 'Bearer ' + idToken, ...(opts.headers || {}) };
  let resp = await fetch(path, { ...opts, headers, cache: 'no-store' });
  if (resp.status === 401) {
    idToken = await currentUser.getIdToken(true);
    headers['Authorization'] = 'Bearer ' + idToken;
    resp = await fetch(path, { ...opts, headers, cache: 'no-store' });
  }
  return resp;
}

async function canvasFetch(path) {
  let all = [];
  let url = '/api/v1' + path;
  url += (url.includes('?') ? '&' : '?') + 'per_page=100';

  while (url) {
    const resp = await api(url);
    if (!resp.ok) throw new Error('Canvas ' + resp.status + ': ' + resp.statusText);
    const data = await resp.json();
    all = all.concat(data);
    url = null;
    const link = resp.headers.get('Link');
    if (link) {
      const next = link.split(',').find(s => s.includes('rel="next"'));
      if (next) {
        const m = next.match(/<([^>]+)>/);
        if (m) url = m[1];
      }
    }
  }
  return all;
}

// ───────────────────────────────────────────────────────
// Dashboard Loading
// ───────────────────────────────────────────────────────
async function loadDashboard() {
  showLoading(true, 'Loading courses...');
  hideError();
  try {
    coursesCache = await canvasFetch('/courses?enrollment_type=teacher&state[]=available&include[]=term&include[]=total_students');
    coursesCache = coursesCache.filter(c =>
      c.enrollments && c.enrollments.some(e => e.type === 'teacher')
    );
    // Only load courses with enrolled students (skips empty/past courses)
    coursesCache = coursesCache.filter(c => (c.total_students || 0) > 0);
    populateCourseSelects();

    showLoading(true, 'Loading missing assignments...');
    const settled = await Promise.allSettled(coursesCache.map(c => loadCourse(c)));
    dashboardData = settled.filter(r => r.status === 'fulfilled').map(r => r.value);
    renderDashboard();
    updateTimestamp();
  } catch (err) {
    showError('Failed to load: ' + err.message);
    console.error(err);
  } finally {
    showLoading(false);
  }
}

function populateCourseSelects() {
  ['grade-course-select', 'bulk-course-select'].forEach(id => {
    const el = document.getElementById(id);
    el.innerHTML = '<option value="">Select course</option>';
    coursesCache.forEach(c => {
      el.innerHTML += '<option value="' + c.id + '">' + esc(c.name) + '</option>';
    });
  });
}

async function loadCourse(course) {
  const [enrollments, sections] = await Promise.all([
    canvasFetch('/courses/' + course.id + '/enrollments?type[]=StudentEnrollment&state[]=active&include[]=user'),
    canvasFetch('/courses/' + course.id + '/sections'),
  ]);

  const sectionMap = {};
  sections.forEach(s => { sectionMap[s.id] = s.name; });

  const studentMap = {};
  enrollments.forEach(e => {
    if (!e.user) return;
    const uid = e.user.id;
    if (!studentMap[uid]) {
      studentMap[uid] = {
        id: uid,
        name: e.user.name,
        sortable_name: e.user.sortable_name || e.user.name,
        section: sectionMap[e.course_section_id] || 'Unknown',
        period: extractPeriod(sectionMap[e.course_section_id] || ''),
        missing: [],
      };
    }
  });

  const assignments = await canvasFetch('/courses/' + course.id + '/assignments?order_by=due_at');
  const published = assignments.filter(a => a.published && a.submission_types && !a.submission_types.includes('not_graded'));

  const BATCH = 6;
  for (let i = 0; i < published.length; i += BATCH) {
    const batch = published.slice(i, i + BATCH);
    await Promise.all(batch.map(async asgn => {
      try {
        const subs = await canvasFetch('/courses/' + course.id + '/assignments/' + asgn.id + '/submissions');
        subs.forEach(sub => {
          if ((sub.missing || sub.late_policy_status === 'missing') && studentMap[sub.user_id]) {
            studentMap[sub.user_id].missing.push({
              id: asgn.id,
              name: asgn.name,
              due: asgn.due_at ? fmtDate(asgn.due_at) : 'No due date',
              points: asgn.points_possible || 0,
            });
          }
        });
      } catch (err) { console.warn('Skip assignment ' + asgn.id + ': ' + err.message); }
    }));
  }

  return {
    course,
    students: Object.values(studentMap).sort((a, b) => a.sortable_name.localeCompare(b.sortable_name)),
  };
}

function extractPeriod(name) {
  const cleaned = name.replace(/\s*\([^)]*\)/g, '').trim();
  const m = cleaned.match(/(?:per(?:iod)?\.?\s*)(\d+)/i) ||
            cleaned.match(/\bp\s*(\d+)\b/i) ||
            cleaned.match(/[-\s](\d+)$/) ||
            cleaned.match(/^(\d+)/);
  return m ? 'Period ' + m[1] : cleaned;
}

function fmtDate(iso) {
  return iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ───────────────────────────────────────────────────────
// Rendering: Overview
// ───────────────────────────────────────────────────────
function renderDashboard() {
  renderSummary();
  renderCourses();
}

function renderSummary() {
  let enrolled = 0, withMissing = 0, totalMissing = 0, maxMissing = 0;
  dashboardData.forEach(cd => {
    enrolled += cd.students.length;
    cd.students.forEach(s => {
      if (s.missing.length > 0) {
        withMissing++;
        totalMissing += s.missing.length;
        if (s.missing.length > maxMissing) maxMissing = s.missing.length;
      }
    });
  });
  document.getElementById('summary-row').innerHTML =
    '<div class="summary-card">' +
      '<div class="label">Students with Missing Work</div>' +
      '<div class="value">' + withMissing + '</div>' +
      '<div class="sub">' + enrolled + ' enrolled across ' + coursesCache.length + ' courses</div>' +
    '</div>' +
    '<div class="summary-card">' +
      '<div class="label">Total Missing Assignments</div>' +
      '<div class="value">' + totalMissing + '</div>' +
    '</div>' +
    '<div class="summary-card">' +
      '<div class="label">Most Missing (Single Student)</div>' +
      '<div class="value">' + maxMissing + '</div>' +
    '</div>';
}

function renderCourses() {
  const container = document.getElementById('courses-container');
  const sorted = [...dashboardData].sort((a, b) => {
    const mp = cd => Math.min(...cd.students.map(s => parseInt((s.period || '').replace(/\D/g, '')) || 999));
    return mp(a) - mp(b);
  });
  container.innerHTML = sorted.map(cd => renderCourseSection(cd)).join('');
}

function renderCourseSection(cd) {
  const periods = {};
  cd.students.forEach(s => {
    const p = s.period || 'Unknown';
    if (!periods[p]) periods[p] = { missing: [], onTrack: [] };
    if (s.missing.length > 0) periods[p].missing.push(s);
    else periods[p].onTrack.push(s);
  });

  const periodKeys = Object.keys(periods).sort((a, b) => {
    const na = parseInt(a.replace(/\D/g, '')) || 999;
    const nb = parseInt(b.replace(/\D/g, '')) || 999;
    return na - nb;
  });

  return '<div class="course-section">' +
    '<div class="course-header">' +
      '<h2>' + esc(cd.course.name) + '</h2>' +
      '<span class="course-badge">' + cd.students.length + ' students</span>' +
    '</div>' +
    periodKeys.map(p => renderPeriod(p, periods[p])).join('') +
  '</div>';
}

function renderPeriod(period, data) {
  const students = sortStudents(data.missing);

  const rows = students.map((s, i) => {
    const count = s.missing.length;
    const pts = s.missing.reduce((t, a) => t + (a.points || 0), 0);
    const cls = count >= 5 ? 'high' : count >= 3 ? 'medium' : 'low';
    const details = s.missing.map(a =>
      '<li>' +
        '<span class="asgn-name">' + esc(a.name) + '</span>' +
        '<span class="asgn-pts">' + a.points + 'pts</span>' +
        '<span class="asgn-due">' + a.due + '</span>' +
      '</li>'
    ).join('');
    return '<div class="student-row" onclick="this.classList.toggle(\'expanded\')">' +
      '<div class="student-row-header">' +
        '<span class="student-num">' + (i + 1) + '</span>' +
        '<span class="student-name">' + esc(s.name) + '</span>' +
        '<span class="missing-pts">' + pts + ' pts</span>' +
        '<span class="missing-count ' + cls + '">' + count + ' missing</span>' +
        '<span class="expand-icon">&#9654;</span>' +
      '</div>' +
      '<div class="student-detail">' +
        '<ul class="assignment-list">' + details + '</ul>' +
      '</div>' +
    '</div>';
  }).join('');

  let onTrackHTML = '';
  if (data.onTrack.length > 0) {
    onTrackHTML = '<div class="on-track-section" onclick="this.classList.toggle(\'open\')">' +
      '<div class="on-track-header">' +
        '<span class="on-track-chevron">&#9654;</span> ' +
        data.onTrack.length + ' students on track' +
      '</div>' +
      '<div class="on-track-list">' +
        data.onTrack.map(s => '<div class="on-track-row"><span class="student-name">' + esc(s.name) + '</span></div>').join('') +
      '</div>' +
    '</div>';
  }

  return '<div class="period-group">' +
    '<div class="period-label">' + esc(period) + '</div>' +
    (students.length > 0 ? '<div class="student-list">' + rows + '</div>' : '') +
    onTrackHTML +
  '</div>';
}

function sortStudents(students) {
  const s = [...students];
  switch (currentSort) {
    case 'first':
      return s.sort((a, b) => a.name.split(' ')[0].localeCompare(b.name.split(' ')[0]));
    case 'most':
      return s.sort((a, b) => b.missing.length - a.missing.length);
    case 'pts':
      return s.sort((a, b) => {
        const pa = a.missing.reduce((t, m) => t + m.points, 0);
        const pb = b.missing.reduce((t, m) => t + m.points, 0);
        return pb - pa;
      });
    default:
      return s.sort((a, b) => a.sortable_name.localeCompare(b.sortable_name));
  }
}

function changeSort(sort) {
  currentSort = sort;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === sort));
  renderCourses();
}

// ───────────────────────────────────────────────────────
// Grading Tab
// ───────────────────────────────────────────────────────
async function loadAssignmentsForGrading() {
  const courseId = document.getElementById('grade-course-select').value;
  const sel = document.getElementById('grade-assignment-select');
  sel.innerHTML = '<option value="">Select assignment</option>';
  document.getElementById('grading-queue').innerHTML = '<div class="empty-state">Select an assignment.</div>';
  document.getElementById('grading-actions').style.display = 'none';
  if (!courseId) return;
  try {
    const assignments = await canvasFetch('/courses/' + courseId + '/assignments?order_by=due_at');
    assignments.filter(a => a.published).forEach(a => {
      sel.innerHTML += '<option value="' + a.id + '" data-pts="' + (a.points_possible || 0) + '">' +
        esc(a.name) + ' (' + (a.points_possible || 0) + ' pts)</option>';
    });
  } catch (e) { showError('Failed to load assignments: ' + e.message); }
}

async function loadGradingQueue() {
  const courseId = document.getElementById('grade-course-select').value;
  const assignmentId = document.getElementById('grade-assignment-select').value;
  const container = document.getElementById('grading-queue');
  document.getElementById('grading-actions').style.display = 'none';
  if (!courseId || !assignmentId) {
    container.innerHTML = '<div class="empty-state">Select an assignment.</div>';
    return;
  }

  const selOpt = document.getElementById('grade-assignment-select').selectedOptions[0];
  const maxPts = selOpt ? selOpt.dataset.pts : '0';

  showLoading(true, 'Loading submissions...');
  try {
    const [submissions, sections] = await Promise.all([
      canvasFetch('/courses/' + courseId + '/assignments/' + assignmentId + '/submissions?include[]=user'),
      canvasFetch('/courses/' + courseId + '/sections'),
    ]);

    const cards = submissions.filter(s => s.user).map(sub => {
      const user = sub.user;
      let status, statusLabel, statusCls;
      if (sub.missing) {
        status = 'missing'; statusLabel = 'Missing'; statusCls = 'missing';
      } else if (sub.workflow_state === 'graded') {
        status = 'graded'; statusLabel = 'Graded'; statusCls = 'graded';
      } else {
        status = 'submitted'; statusLabel = 'Submitted'; statusCls = 'submitted';
      }
      const currentGrade = sub.grade || '';
      return '<div class="grade-card" data-student-id="' + user.id + '">' +
        '<span class="grade-card-name">' + esc(user.sortable_name || user.name) + '</span>' +
        '<span class="grade-card-status ' + statusCls + '">' + statusLabel + '</span>' +
        '<input class="grade-input" type="number" min="0" max="' + maxPts + '" placeholder="Score" value="' + currentGrade + '" data-field="score">' +
        '<span class="grade-max">/ ' + maxPts + '</span>' +
        '<div style="width:100%">' +
          '<textarea class="grade-comment" placeholder="Comment (optional)" data-field="comment"></textarea>' +
        '</div>' +
      '</div>';
    }).join('');

    container.innerHTML = cards || '<div class="empty-state">No submissions found.</div>';
    if (cards) document.getElementById('grading-actions').style.display = 'block';
  } catch (e) {
    container.innerHTML = '<div class="empty-state">Error: ' + esc(e.message) + '</div>';
  } finally { showLoading(false); }
}

async function submitAllGrades() {
  const courseId = document.getElementById('grade-course-select').value;
  const assignmentId = document.getElementById('grade-assignment-select').value;
  if (!courseId || !assignmentId) return;

  const cards = document.querySelectorAll('#grading-queue .grade-card');
  const grades = [];
  cards.forEach(card => {
    const sid = card.dataset.studentId;
    const score = card.querySelector('[data-field="score"]').value;
    const comment = card.querySelector('[data-field="comment"]').value.trim();
    if (score !== '' || comment) {
      grades.push({ student_id: sid, score: score !== '' ? Number(score) : null, comment });
    }
  });

  if (grades.length === 0) { alert('No grades to submit. Enter scores or comments first.'); return; }
  if (!confirm('Apply ' + grades.length + ' grade(s) to Canvas? This will update student records.')) return;

  showLoading(true, 'Applying ' + grades.length + ' grades...');
  try {
    const resp = await api('/api/batch/grades', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ course_id: courseId, assignment_id: assignmentId, grades }),
    });
    const result = await resp.json();
    const ok = result.results.filter(r => r.ok).length;
    const failed = grades.length - ok;
    alert('Done! ' + ok + '/' + grades.length + ' grades applied.' + (failed > 0 ? ' ' + failed + ' failed.' : ''));
    loadGradingQueue();
  } catch (e) {
    showError('Grade submission failed: ' + e.message);
  } finally { showLoading(false); }
}

// ───────────────────────────────────────────────────────
// Search Tab
// ───────────────────────────────────────────────────────
function handleAssignmentSearch() {
  const q = document.getElementById('assignment-search').value.trim().toLowerCase();
  const container = document.getElementById('search-results');
  if (q.length < 2) {
    container.innerHTML = '<div class="empty-state">Type at least 2 characters to search.</div>';
    return;
  }
  const results = [];
  dashboardData.forEach(cd => {
    const assignmentMap = {};
    cd.students.forEach(s => {
      s.missing.forEach(a => {
        if (a.name.toLowerCase().includes(q)) {
          if (!assignmentMap[a.name]) assignmentMap[a.name] = { name: a.name, students: [] };
          assignmentMap[a.name].students.push(s);
        }
      });
    });
    Object.values(assignmentMap).forEach(a => results.push({ ...a, course: cd.course.name }));
  });

  if (results.length === 0) {
    container.innerHTML = '<div class="empty-state">No matching missing assignments found.</div>';
    return;
  }
  container.innerHTML = results.map(r =>
    '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:1rem;">' +
      '<h3 style="font-size:0.95rem;color:var(--text-bright);margin-bottom:0.25rem;">' + esc(r.name) + '</h3>' +
      '<div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:0.5rem;">' +
        esc(r.course) + ' &middot; ' + r.students.length + ' students missing' +
      '</div>' +
      '<ul style="list-style:none;">' +
        r.students.map(s =>
          '<li style="padding:0.2rem 0;font-size:0.85rem;color:var(--text);">' +
            esc(s.name) +
            ' <span style="color:var(--text-muted);font-size:0.75rem;">' + esc(s.period) + '</span>' +
          '</li>'
        ).join('') +
      '</ul>' +
    '</div>'
  ).join('');
}

// ───────────────────────────────────────────────────────
// Bulk Comment Tab
// ───────────────────────────────────────────────────────
async function loadAssignmentsForBulk() {
  const courseId = document.getElementById('bulk-course-select').value;
  const sel = document.getElementById('bulk-assignment-select');
  sel.innerHTML = '<option value="">Select assignment</option>';
  document.getElementById('bulk-count').textContent = '';
  document.getElementById('bulk-send-btn').disabled = true;
  bulkTargets = [];
  if (!courseId) return;
  try {
    const assignments = await canvasFetch('/courses/' + courseId + '/assignments?order_by=due_at');
    assignments.filter(a => a.published).forEach(a => {
      sel.innerHTML += '<option value="' + a.id + '">' + esc(a.name) + '</option>';
    });
  } catch (e) { showError(e.message); }
}

async function loadBulkTargets() {
  const courseId = document.getElementById('bulk-course-select').value;
  const assignmentId = document.getElementById('bulk-assignment-select').value;
  bulkTargets = [];
  document.getElementById('bulk-count').textContent = '';
  document.getElementById('bulk-send-btn').disabled = true;
  if (!courseId || !assignmentId) return;

  showLoading(true, 'Finding missing students...');
  try {
    const subs = await canvasFetch('/courses/' + courseId + '/assignments/' + assignmentId + '/submissions?include[]=user');
    bulkTargets = subs
      .filter(s => s.missing && s.user)
      .map(s => ({ student_id: s.user_id, name: s.user.name }));
    document.getElementById('bulk-count').textContent =
      bulkTargets.length + ' students have not submitted this assignment.';
    document.getElementById('bulk-send-btn').disabled = bulkTargets.length === 0;
  } catch (e) { showError(e.message); }
  finally { showLoading(false); }
}

async function sendBulkComments() {
  const courseId = document.getElementById('bulk-course-select').value;
  const assignmentId = document.getElementById('bulk-assignment-select').value;
  const comment = document.getElementById('bulk-comment').value.trim();
  if (!comment) { alert('Please write a comment first.'); return; }
  if (bulkTargets.length === 0) return;
  if (!confirm('Send this comment to ' + bulkTargets.length + ' students?')) return;

  showLoading(true, 'Sending to ' + bulkTargets.length + ' students...');
  try {
    const resp = await api('/api/batch/comments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        course_id: courseId,
        assignment_id: assignmentId,
        student_ids: bulkTargets.map(t => t.student_id),
        comment,
      }),
    });
    const result = await resp.json();
    document.getElementById('bulk-results').innerHTML =
      '<div style="background:rgba(50,205,100,0.08);border:1px solid rgba(50,205,100,0.2);border-radius:10px;padding:1rem;color:var(--success);font-size:0.9rem;">' +
        'Sent ' + result.succeeded + '/' + result.total + ' comments successfully.' +
      '</div>';
    document.getElementById('bulk-comment').value = '';
  } catch (e) { showError(e.message); }
  finally { showLoading(false); }
}

// ───────────────────────────────────────────────────────
// Tab Switching
// ───────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.toggle('active', t.id === 'tab-' + tab));
}

// ───────────────────────────────────────────────────────
// Utilities
// ───────────────────────────────────────────────────────
function manualRefresh() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  loadDashboard().finally(() => btn.classList.remove('spinning'));
}

function updateTimestamp() {
  const now = new Date();
  document.getElementById('last-updated').innerHTML =
    'Last updated<br>' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function showLoading(show, text) {
  const el = document.getElementById('loading-overlay');
  if (text) document.getElementById('loading-text').textContent = text;
  el.classList.toggle('visible', show);
}

function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('error-banner').style.display = 'none';
}
</script>
