services:
  - type: web
    name: pvhs-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -u server.py
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: CANVAS_TOKEN
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: API_KEY
        sync: false
